<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عقاب TV - المشغل التجريبي</title>
    <style>
        body { background-color: #0b0f19; color: #ffffff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #ffcc00; }
        .player-container { max-width: 800px; margin: 20px auto; background: #161b26; padding: 10px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.5); }
        video { width: 100%; border-radius: 4px; }
        .info { margin-top: 15px; color: #a0aec0; }
    </style>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <h1>عقاب TV 🦅</h1>
    <p>البث المباشر التجريبي (مصادر مصرحة وقانونية)</p>

    <div class="player-container">
        <video id="video" controls autoplay muted></video>
        <div class="info">القناة الحالية: بث مباشر تجريبي مفتوح</div>
    </div>

    <script>
        var videoSrc = 'https://bofastream.net';
        var video = document.getElementById('video');

        if (Hls.isSupported()) {
            var hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
        }
    </script>

</body>
</html>
